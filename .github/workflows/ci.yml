name: CI
run-name: ${{ github.ref_type == 'tag' && format('Build {0}', github.ref_name) || github.event.pull_request.title || github.event.head_commit.message || format('Build {0}', github.ref_name) }}

# Builds and tests the solution, packs each library, and publishes the packages to ProGet.
# v* tags publish that version (v1.3.0 -> 1.3.0). Pushes to main publish a prerelease of the
# next version from next-version (1.3.0-ci.<run>). Pull requests build, test and pack only.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # never cancel a main or tag run part-way through publishing
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build & test
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: aneillans/github-templates/.github/workflows/dotnet-ci.yml@v1
    with:
      project: Neillans.Adapters.Secrets.sln
      audit_vulnerable: true

  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      package_version: ${{ steps.package.outputs.version }}
    steps:
      - id: next
        uses: aneillans/github-templates/actions/next-version@v1
        with:
          # a PR's merge commit belongs to no PR, so version from its head; empty on other events
          sha: ${{ github.event.pull_request.head.sha }}

      - id: package
        env:
          VERSION: ${{ steps.next.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION-ci.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

  pack:
    name: Pack ${{ matrix.name }}
    needs: [test, version]
    strategy:
      matrix:
        name:
          - Core
          - AzureKeyVault
          - Infisical
          - BitWarden
          - HashiCorpVault
          - InMemory
    uses: aneillans/github-templates/.github/workflows/dotnet-pack.yml@v1
    with:
      project: Neillans.Adapters.Secrets.${{ matrix.name }}/Neillans.Adapters.Secrets.${{ matrix.name }}.csproj
      package_version: ${{ needs.version.outputs.package_version }}
      artifact_name: nupkg-${{ matrix.name }}

  publish:
    name: Publish to ProGet
    needs: pack
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    uses: aneillans/github-templates/.github/workflows/dotnet-nuget-publish.yml@v1
    with:
      feed_url: ${{ vars.PROGET_URL }}
    secrets:
      feed_api_key: ${{ secrets.PROGET_API_KEY }}
